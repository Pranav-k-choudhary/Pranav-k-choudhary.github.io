<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Education</title>
    <!--local bs CSS-->
    <link rel="stylesheet" href="bootstrap.css">
    <style>
        body {   /*body bg same to resume body bg*/
            min-height: 100vh;
            background: radial-gradient(
                125% 125% at 50% 10%,
                #000 40%,
                #6633ee 100%
            );
        }
       .two2{     /*center align text*/
            display: flex;
            justify-content: center;    /*horizontly center*/
        }
        .two3{
            display: flex;
            justify-content: center;
        }
        .two2, .two3 {     /*table style*/
            width: 80%;    /*table width*/
            margin: auto;  /*center table*/
            border-collapse: collapse;   /*remove double borders*/
        }
        .two2 th, .two2 td,    /*table cells style*/
        .two3 th, .two3 td {
            border: 2px solid #ccc;     /*border*/
            padding: 15px;                /*space inside cell*/
            text-align: center;           /*center text*/
        }
        .two2 th, .two3 th {      /*table header*/
            background-color: #0077b6;     /*blue bg*/
            color: #fff;                   /*white text*/
        }
        .two2 tr:hover,         /*hover efect on row*/
        .two3 tr:hover {
            background-color: #d0e8ff;    /*light blue on hover*/
            cursor: pointer;                
        }
        .two2 tr:nth-child(even) {      /*alternate row color*/
            background-color: #f2f2f2;   /*light grey*/
        }
        .two2 tr:nth-child(odd) {
            background-color: #c4bdbd;   /*dark grey*/
        }
        .two3 tr:nth-child(even) {
            background-color: #f2f2f2;   /*light grey*/
        }
        .two2 tr:hover {   /*hover effect on tr*/
            background-color: #d0e8ff; 
        }
        .two3 tr:hover {    /*hover effect on tr*/
            background-color: #d0e8ff; 
        }
    </style>
    <!-- BS CDN-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!--BS JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!--exit btn, position-relative -> parent container, mt-4 -> margin-top-->
    <div class="position-relative mt-4">
        <!--position-absolute -> fixed position inside parent,end-0 -> right side, top-50 -> middle vertically,translate-middle-y -> perfect vertical center, me-3 -> margin right-->
        <div class="position-absolute end-0 top-50 translate-middle-y me-3">
            <!--btn -> btn style, btn-danger -> red color-->
            <a href="index.html" class="btn btn-danger">Exit</a>
        </div>
    </div>
    <!--education part-->
    <section class="education">
        <!--mb-5 -> margin bottom, text-center -> center text,text-white -> white text, m-0 -> remove margin-->
        <h1 class="mb-5 text-center text-white m-0">My Education</h1>
        <!--first table, two2 -> custom table style-->
        <table class="two2">
            <tr>
                <th>Class</th>
                <th>Board</th>
                <th>Marks / Percentage</th>
            </tr>
            <tr>
                <td>10th</td>
                <td>BSEB</td>
                <td>82%</td>
            </tr>
            <tr>
                <td>12th</td>
                <td>BSEB</td>
                <td>79%</td>
            </tr>
        </table>
    </section>

    <br>

    <!--sec table, two3 -> custom table style-->
    <table class="two3">
        <tr>
            <th>Qualification</th>
            <th>Institute</th>
            <th>Year</th>
            <th>Result</th>
        </tr>
        <tr>
            <td>Graduation (Computer Science)</td>
            <td>Galgotias University</td>
            <td>Pursuing (2023 - Present)</td>
            <td>8.51 CGPA (Till 5th Sem)</td>
        </tr>
    </table>

    <br>
    <!--imges-->
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" alt="education" height="200">
    <img src="https://www.freeiconspng.com/uploads/education-png-0.png" alt="image" height="200">
</body>
</html>
