<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--makes page responsive on all devices-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Education</title>
    <!--Bs CSS: used for ready-made UI components like tables, progress bars, spacing-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--font awesome: used for icons(book, building, graph, graduation cap)-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /*same as a resume bg*/
        body{
            min-height: 100vh;
            background: radial-gradient(
                125% 125% at 50% 10%,
                #000 40%,
                #6633ee 100%
            );
            color: white;   /*for text color on the body*/
        }
        /*heading style*/
        h1{
            font-weight: bold;
        }
        /*custom table design -> this is not default Bootstrap table,  width 85% -> reduce space on sides, margin:auto -> centers table, backdrop-filter: blur -> creates glass effect, rgba background -> transparent look, border-radius -> rounded corners, overflow:hidden → prevents content overflow outside rounded corners*/
        .table-custom{
            width: 85%;
            margin: auto;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            animation: fadeInUp 5s ease forwards;   /*animation when page loads again and again*/
        }
        /*table cells style -> th = table header, td = table data,padding -> space inside cell, text-align -> center align,border -> light transparent border for structure*/
        .table-custom th, .table-custom td{
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        /*th style -> bg color set*/
        .table-custom th{
            background: #0077b6;
        }
        /*transition -> makes animation smooth*/
        .table-custom tr{
            transition: all 0.3s ease;
        }
        /*hover effect -> row hever(tr), transform -> scale(1.02) -> zoom effect*/
        .table-custom tr:hover{
            transform: scale(1.02);
            background: #90e0ef;
            color: black;
            cursor: pointer;
        }
        /*keyframwe animation page load effects, fadeInUp -> smooth entrance animation, from -> element starts like 0 opicity and transform (translate) Y axis moving smoothly, to -> element becomes visible and moves to normal position*/
        @keyframes fadeInUp{
            from{
                opacity: 0;
                transform: translateY(60px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }
        /*Mobile supports -> when screen width is 768px or less -> table becomes full width, font size decreases for better fit*/
        @media(max-width:768px){
            .table-custom{
                width: 100%;
                font-size: 12px;
            }
        }    
    </style>
</head>
<body>
    <!--exit btn concept same as a resume page-->
    <div class="position-relative mt-4">
        <div class="position-absolute end-0 top-50 translate-middle-y me-3">
            <a href="index.html" class="btn btn-danger">Exit</a>
        </div>
    </div>
    <!--education sec-->
    <section>
        <!--page tittle-->
        <h1 class="text-center mb-5">🎓 My Education</h1>
        <!--school table -> table styled using custom css class-->
        <table class="table-custom">
            <tr>
                <!--for icon with content-->
                <th><i class="fa-solid fa-book"></i> Class</th>
                <th><i class="fa-solid fa-building-columns"></i> Board</th>
                <th><i class="fa-solid fa-chart-line"></i> Performance</th>
            </tr>
            <tr>
                <td>10th</td>
                <td>BSEB</td>
                <td>
                    <!--bs Progress Bar-->
                    <div class="progress">
                        <div class="progress-bar bg-success" style="width:82%">82%</div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>12th</td>
                <td>BSEB</td>
                <td>
                    <div class="progress">
                        <div class="progress-bar bg-info" style="width:79%">79%</div>
                    </div>
                </td>
            </tr>
        </table>

        <br><br>

        <!--college table-->
        <table class="table-custom">
            <tr>
                <th><i class="fa-solid fa-graduation-cap"></i> Qualification</th>
                <th>Institute</th>
                <th>Year</th>
                <th>Result</th>
            </tr>
            <tr>
                <td>Graduation (CSE)</td>
                <td>Galgotias University</td>
                <td>2023 - Present</td>
                <td>8.51 CGPA</td>
            </tr>
        </table>
    </section>
    
    <br>

    <!--for last two photo-->
    <div class="text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png" height="150">
        <img src="https://www.freeiconspng.com/uploads/education-png-0.png" height="150">
    </div>


</body>
</html>
