<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Skills</title>
    <!--local bs CSS-->
    <link rel="stylesheet" href="bootstrap.css">
    <style>
        /*same as a resume bg*/
        body{
            min-height: 100vh;
            background: radial-gradient(
                125% 125% at 50% 10%,
                #000 40%,
                #6633ee 100%
            );
            color: white;   /*for text color on the body*/
        }
        /*heading style*/
        h1{
            font-weight: bold;
        }
        /*custom table design -> this is not default Bootstrap table,  width 85% -> reduce space on sides, margin:auto -> centers table, backdrop-filter: blur -> creates glass effect, rgba background -> transparent look, border-radius -> rounded corners, overflow:hidden → prevents content overflow outside rounded corners*/
        .table-custom{
            width: 85%;
            margin: auto;
            backdrop-filter: blur(10px);
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            animation: fadeInUp 5s ease forwards;   /*animation when page loads again and again*/
            color: white;
        }
        /*table cells style -> th = table header, td = table data,padding -> space inside cell, text-align -> center align,border -> light transparent border for structure*/
        .table-custom th, .table-custom td{
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .table-custom td{
            text-align: left;
            padding-left: 90px;
        }
        /*th style -> bg color set*/
        .table-custom th{
            background: #0077b6;
        }
        /*transition -> makes animation smooth*/
        .table-custom tr{
            transition: all 0.3s ease;
        }
        /*hover effect -> row hever(tr), transform -> scale(1.02) -> zoom effect*/
        .table-custom tr:hover{
            transform: scale(1.02);
            background: #90e0ef;
            color: black;
            cursor: pointer;
        }
        /*keyframwe animation page load effects, fadeInUp -> smooth entrance animation, from -> element starts like 0 opicity and transform (translate) Y axis moving smoothly, to -> element becomes visible and moves to normal position*/
        @keyframes fadeInUp{
            from{
                opacity: 0;
                transform: translateY(60px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }
        /*Mobile supports -> when screen width is 768px or less -> table becomes full width, font size decreases for better fit*/
        @media(max-width:768px){
            .table-custom{
                width: 100%;
                font-size: 12px;
            }
        }    
    </style>
    <!--BS CSS -> for buttons, spacing, etc-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!--BS JS -> for interactive components-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <!--exit btn -> top-right side, same to resume exit btn concept-->
    <div class="position-relative mt-4">
            <div class="position-absolute end-0 top-50 translate-middle-y me-3">
                <a href="index.html" class="btn btn-danger">Exit</a>
            </div>
    </div>
    
    <section>
        <!--page tittle-->
        <h1 class="text-center mb-5 text-white">My Skills</h1>
        <!--skill table, skills-table -> custom table styling-->
        <table class="table-custom">
            <tr>
                <!--table heading-->
                <th><strong>Skills</strong></th>
            </tr>
            <!--skill item-->
            <tr>
                <td><strong>Programming language: </strong> Java, Python, JavaScript</td>
            </tr>
            <tr>
                <td><strong>Frontend: </strong> HTML, CSS, BootStrap & JavaScript</td>
            </tr>
            <tr>
                <td><strong>Backend: </strong> Node.Js & Express.Js</td>
            </tr>
            <tr>
                <td><strong>Database: </strong> MongoDB & SQL</td>
            </tr>
            <tr>
                <td><strong>Tools & Platforms: </strong> Github & VS Code</td>
            </tr>
            <tr>
                <td><strong>Soft Skills: </strong> TeamWork, Critical Thinking and Problem Solving</td>
            </tr>
            <tr>
                <td>DBMS, DSA, OS</td>
            </tr>
        </table>
    </section>
</body>
</html>
