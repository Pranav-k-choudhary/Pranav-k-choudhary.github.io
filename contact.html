<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contect me</title>
    <style>
        body {      /*full page background with gradient same as education page bg concepts follow*/
            min-height: 100vh;
            background: radial-gradient(
                125% 125% at 50% 10%,
                #000 40%,
                #6633ee 100%
            );
        }
        #contact{         /*contact section styling*/
            padding: 60px;     /*space inside section*/
            text-align: center;     /*center align text*/
        }
        .contact-container{    /*container limit for width*/
            max-width: 600px;  /*max width*/
            margin: auto;      /*center horizontaly*/
        }
        .contact-form{        /*form layout using flexbox*/
            display: flex;
            flex-direction: column;   /*vertical layout -> ek ke niche ek form item*/
            gap: 12px;    /*space between inputs*/
        }
        .contact-form input,     /*i/p and textarea styling*/
        .contact-form textarea{
            padding: 12px;
            border: 1px solid #bdbbbb;
            border-radius: 8px;
            outline: none;     /*remove default blue outline*/
        }
        .contact-form button{        /*Btn styling*/
            padding: 12px;
            background: #0077b6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;   /*smooth for hover effect*/
        }
        .contact-form button:hover{   /*btn hover effect*/
            background: #78a1d3;
        }
        .contact-info{     /*contact info section*/
            margin-top: 20px;   /*space from top*/
            font-size: 15px;
        }
        
    </style>
    <!--Bs CSS for styling-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    

</head>
<body >
    <!--exit btn on top-right same as another page exit btn-->
    <div class="position-relative mt-5">
        <div class="position-absolute end-0 top-50 translate-middle-y me-3">
            <a href="index.html" class="btn btn-danger">Exit</a>
        </div>
    </div>

    <!--contact section-->
    <section class="" id="contact">
        <!--heading, text-center -> center text, text-white -> white color-->
        <h1 class="text-center m-0"><h1 class="text-center text-white">Contact Me</h1></h1>
        <!--contact-container -> custom css styling, mt-5 -> margin top-->
        <div class="contact-container mt-5">
            <!--contact form -> custom css styling using internal css, action -> sends data to Formspree for email sending, method POST -> send securely-->
            <form id="contactForm" class="contact-form" 
                action="https://formspree.io/f/xzdklorn" method="POST"> <!-- Form action: sends data to Formspree for email handling -->

                <!--input fields-->
                <input name="name" type="text" placeholder="Your Name" required />
                <input name="email" type="email" placeholder="Your Email" required />
                <input name="subject" type="text" placeholder="Subject" required />
                <!--msg box-->
                <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                <!--submit btn-->
                <button type="submit">Send Message</button>
            </form>
            <!--contact info -> custom css style-->
            <div class="contact-info">
                <p class="text-white">Location: India</p>
                <p class="text-white">Email: pranav.dev049@gmail.com</p>
            </div>
        </div>
    </section>

    <!--js logic-->
    <script>
        //select form by id
        const form = document.getElementById("contactForm");
        //add event listener when form is submitted
        form.addEventListener("submit", async function(e) {
            //prevent default form submit(page reload)
            e.preventDefault();
            //collect all form data
            const data = new FormData(form);
            //send data to formspree using fetch api
            const response = await fetch(form.action, {
                method: "POST",   //send data
                body: data,       //form data
                headers: {
                    'Accept': 'application/json'     //expect JSON response
                }
            });
            //if submission successful
            if (response.ok) {
                window.location.href = "send.html";  //redirect to success page
            }
        });
    </script>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
</body>
</html>
